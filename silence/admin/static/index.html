<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silence admin</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="ez-ui/js/theme-init.js"></script>
  <link rel="stylesheet" href="ez-ui/css/ez-ui.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="sa-layout">
    <nav class="ez-navbar ez-navbar--side sa-side" aria-label="Admin panel">
      <div class="ez-navbar__inner">
        <a class="ez-navbar__brand sa-brand" href="#/">Silence <span class="sa-brand__sub">admin</span></a>
        <button class="ez-button ez-button--secondary ez-navbar__toggle" type="button" aria-expanded="false">Menu</button>
        <ul class="ez-navbar__links">
          <li><a href="#/">Overview</a></li>
          <li><a href="#/database">Database <span class="sa-dot" id="dot-database"></span></a></li>
          <li><a href="#/users">Users</a></li>
          <li><a href="#/endpoints">Endpoints <span class="ez-badge" id="count-endpoints"></span></a></li>
          <li><a href="#/tests">Tests <span class="ez-badge" id="count-tests"></span></a></li>
          <li><a href="#/stats">Statistics</a></li>
        </ul>
        <div class="sa-side__footer">
          <p class="sa-project" id="project-name"></p>
          <p><a id="link-web" href="/" target="_blank">Open the web app</a> · <a id="link-api" href="/api" target="_blank">API</a></p>
          <p id="acting-as" class="sa-acting" hidden></p>
          <button class="ez-button ez-button--secondary ez-theme-toggle" type="button" id="theme">
            <span class="ez-theme-toggle__to-dark">Dark theme</span>
            <span class="ez-theme-toggle__to-light">Light theme</span>
          </button>
          <p class="sa-version" id="version"></p>
        </div>
      </div>
    </nav>
    <main class="sa-main" id="page" aria-live="polite"></main>
  </div>

  <dialog class="ez-dialog sa-dialog" id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="ez-dialog__actions">
        <button class="ez-button ez-button--secondary" value="cancel" formnovalidate>Cancel</button>
        <button class="ez-button" value="confirm" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>
</body>
</html>
