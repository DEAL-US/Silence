<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="ez-ui/js/theme-init.js"></script>
  <link rel="stylesheet" href="ez-ui/css/ez-ui.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/vendor/axios.min.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <nav class="ez-navbar">
    <div class="ez-container ez-navbar__inner">
      <a class="ez-navbar__brand" href="index.html">Mi aplicación</a>
    </div>
  </nav>

  <main class="ez-container app-narrow">
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <div class="ez-field">
        <label for="identifier">Usuario</label>
        <input id="identifier" required autocomplete="username">
      </div>
      <div class="ez-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <button class="ez-button" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
